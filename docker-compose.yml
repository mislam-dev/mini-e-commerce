services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini_ecom_api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=mini_ecom
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "pnpm run migration:run && pnpm run seed && pnpm run start:dev"
    networks:
      - mini_ecom_network

  postgres:
    image: postgres:16-alpine
    container_name: mini_ecom_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_ecom
    ports:
      - "5432:5432"
    volumes:
      - mini_ecom_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mini_ecom_network

  redis:
    image: redis/redis-stack:latest
    container_name: mini_ecom_redis
    ports:
      - "6379:6379"
      - "8002:8001"
    volumes:
      - mini_ecom_redis_data:/data
    restart: always
    networks:
      - mini_ecom_network

volumes:
  mini_ecom_data:
  mini_ecom_redis_data:

networks:
  mini_ecom_network:
    driver: bridge
